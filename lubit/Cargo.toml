[package]
name = "lubit"
version = "0.1.0"
edition = "2021"

[dependencies]
compact_str = { version = "0.7.1", features = ["serde"] }
reqwest = { version = "0.12.5", features = ["json", "cookies", "gzip", "rustls-tls", "native-tls-vendored", "stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_bencode = "0.2.4"
serde_bytes = "0.11.15"
tokio = { version = "1.38.0", features = ["full"] }
tokio-stream = "0.1.15"

[dev-dependencies]
anyhow = "1.0.86"
